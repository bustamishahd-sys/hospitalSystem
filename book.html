<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Departments | Book</title>
    <link href=".\src\output.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href=".\src\output.css" rel="stylesheet">
</head>
<body>
      <header>
        <div class="container mx-auto row justify-between py-4.5 px-8 relative" >
            <div class="md:hidden">
                <input type="checkbox" id="menu" class="hidden peer">
             <div class="flex justify-between items-center p-4">
                <label for="menu" class="cursor-pointer"><img src="./src/ICONS/Menu.svg" alt="menu"></label>
             </div>
             <div class="hidden peer-checked:flex bg-gray-100  absolute top-full left-8 flex flex-col px-4" >
                <a href="./index.html" class="text-sm text-[var(--color-muted)] py-2">Home</a>
                 <a href="./doctors.html" class="text-sm text-[var(--color-muted)] py-2">Doctors</a>
                 <a href="./clinics.html" class="text-sm text-[var(--color-muted)] py-2">Clinics</a>
                  <a href="./book.html" class="text-sm text-[var(--color-muted)] py-2">Book</a>
                   <a href="./about.html" class="text-sm text-[var(--color-muted)] py-2">About</a>
                   <a href="./contact.html" class="text-sm text-[var(--color-muted)] py-2">Contact</a>
             </div>
            </div>
            <div class="row justify-between gap-12">
                <a href="./index.html" class="text-xl font-bold text-[var(--color-primary)]">MedPrecise</a>
                <ul class="row justify-between gap-6 text-sm text-[var(--color-muted)] hidden  md:flex">
                    <li>
                        <a href="./index.html" class="nav-link">Home</a>
                    </li>
                    <li>
                        <a href="./doctors.html" class="nav-link">Doctors</a>
                    </li>
                    <li>
                        <a href="./clinics.html" class="nav-link ">Clinics</a>
                    </li>
                    <li>
                        <a href="./book.html" class="nav-link selected">Book</a>
                    </li>
                    <li>
                        <a href="./about.html" class="nav-link">About</a>
                    </li>
                    <li>
                        <a href="./contact.html" class="nav-link">Contact</a>
                    </li>
                </ul>
            </div>
            <div class="icons">
                <ul class="row justify-between gap-4">
                    <li>
                        <a href="#"><img src="./src/ICONS/search.svg"></a>
                    </li>
                    <li class="hidden md:block">
                        <a href="#"><img src="./src/ICONS/pro.svg"></a>
                    </li>
                    <li class="hidden md:block">
                        <a href="#"><img src="./src/ICONS/not.svg"></a>
                    </li>
                </ul>

            </div>

        </div>
    </header>
<section class="px-8 2xl:px-0  flex items-center justify-start">
    <div class="container  py-12 flex flex-col gap-1 max-w-2xl ">
<p class="text-5xl font-bold text-[var(--color-darker)]">Checkout</p>
<p class="text-[15px] text-[var(--color-dark)]">Confirm your appointment details and patient information to secure your slot with MedPrecise
specialists.</p>
    </div>
</section>
<section class="px-8">
    <div class="container grid grid-cols-1 md:grid-cols-[1.5fr_1fr] gap-12">
        <div class="information flex flex-col gap-6">
      <div class="Contact-Details  border border-[var(--color-border)] bg-[var(--color-bg3)] rounded-md p-6">
        <div class="row gap-2 mb-4">
            <img src="./src/ICONS/Contact Details.svg"/>
           <h3>Contact Details</h3>
</div>
                 <div class="form grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div>
                    <label for="name" >Full Name</label>
                    <input type="text" id="name" name="full name" placeholder="John Doe">
                </div>
                <div>
                  <label for="email" >Email Address</label>
                    <input type="email" id="email" name="email address" placeholder="john@example.com">   
                </div>
            </div>
                  <div class="form mt-4">
                  <label for="phone" >Phone Number</label>
                    <input type="tel" id="phone" name="Phone Number" placeholder="+1 (555) 000-0000">   
                </div>


      </div>
      <div class="Patient-Info border border-[var(--color-border)] bg-[var(--color-bg3)] rounded-md p-6">
     <div class="row gap-2 mb-4">
       <img src="./src/ICONS/Patient Info.svg">
           <h3>Patient Info</h3>
        </div>
        <div class="form grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div>
                    <label for="Age">Age</label>
                    <input type="number" id="Age" name="Age" placeholder="25">
                </div>
                <div>
                  <label for="Gender" >Gender</label>
                    <select type="radio" id="Gender" name="Gender"><option class="text-[15px] text-[var(--color-b)]">Male</option>
                    <option class="text-[15px] text-[var(--color-b)] >Female</option></select> 
                </div>
            </div>
             <div class="form mt-4">
                    <label for="note">Notes / Optional Symptoms</label><br>
                    <textarea id="note" placeholder="Briefly describe any specific concerns or medical history..." rows="4"></textarea>
                </div>
      </div>
      <div class="Appointment-Selection border border-[var(--color-border)] bg-[var(--color-bg3)] rounded-md p-6">
        <div class="row gap-2 mb-4">
       <img src="./src/ICONS/ap selection.svg">
           <h3>Appointment Selection</h3>
        </div>
        <div class="form grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div>
                    <label for="date">Preferred Date</label>
                    <input type="date" id="date" name="date">
                </div>
                 <div>
                    <label for="time">Preferred Time</label>
                    <input type="time" id="time" name="time">
                </div>
            </div>
      </div>
        </div>
        <div class="booking-summary  border border-[var(--color-border)] bg-[var(--color-bg3)] rounded-md p-6">
            <div class="form">
                  <label for="doctor" >Select Practitioner</label>
                    <select type="radio" id="doctor" name="doctor">
                    <option class="text-[15px] text-[var(--color-b)] ">Choose a Doctor</option>
                    <option class="text-[15px] text-[var(--color-b)] >Dr. James Wilson</option>
                    <option class="text-[15px] text-[var(--color-b)] >Dr. Michael Aris</option>
                </select> 
                </div>
        
    </div>
</section>
    
</body>
</html>
